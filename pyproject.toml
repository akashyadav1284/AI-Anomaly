[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-anomaly-detection"
version = "0.2.0"
description = "AI-Based IoT Sensor Anomaly Detection - Core, ML Research & Data Engineering"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI IoT Research Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
