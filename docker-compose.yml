services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: iot-anomaly-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017
      - DATABASE_NAME=iot_anomaly_detection
      - API_KEY=${API_KEY:-dev-insecure-key-change-in-prod}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-insecure-jwt-key-change-in-prod}
    volumes:
      - ./artifacts:/app/artifacts
      - ./uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: iot-anomaly-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # Local MongoDB development database prepared for Phase 4
  mongodb:
    image: mongo:7.0
    container_name: iot-anomaly-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=iot_anomaly_detection
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
